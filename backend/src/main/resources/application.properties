# ==============================================================
# 1. THÔNG TIN ỨNG DỤNG
# ==============================================================
spring.application.name=backend
server.port=8081

# ==============================================================
# 2. CẤU HÌNH DATABASE (POSTGRESQL)
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/shopcart_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# 3. CẤU HÌNH HIKARI CONNECTION POOL (Tối ưu hiệu năng)
# ==============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================
# 4. JPA / HIBERNATE
# ==============================================================
# Tự động cập nhật cấu trúc bảng dựa trên Entity Java (nhanh hon create)
# SET TO 'create-drop' TO RESET DATABASE WITH CLEAN USER DATA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chỉ định Dialect chuẩn cho PostgreSQL để tránh các lỗi SQL không tương thích
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# 5. CẤU HÌNH SEEDER (Tự động nạp dữ liệu từ data.sql)
# ==============================================================
# Luôn chạy script SQL mỗi khi khởi động ứng dụng
spring.sql.init.mode=always

# QUAN TRỌNG: Đợi Hibernate tạo bảng xong mới chạy data.sql
spring.jpa.defer-datasource-initialization=true

# Tiếp tục khởi động nếu gặp lỗi nhỏ trong script (ví dụ: dữ liệu đã tồn tại)
spring.sql.init.continue-on-error=true

# ==============================================================
# 6. XỬ LÝ DỮ LIỆU & JSON
# ==============================================================
# Tránh lỗi đệ quy vòng lặp khi trả về dữ liệu Order - OrderItem
spring.jackson.serialization.fail-on-empty-beans=false
# Tắt cảnh báo open-in-view nếu bạn không cần thiết
spring.jpa.open-in-view=false

# ==============================================================
# 7. LOGGING (Hỗ trợ Debug)
# ==============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG