name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: shopcart_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run backend tests with coverage
        run: |
          cd backend
          mvn clean test
      
      - name: Generate JaCoCo coverage report
        run: |
          cd backend
          mvn jacoco:report
      
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 30
      
      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 30

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      
      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm run test:coverage -- --run
      
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30
      
      - name: Upload frontend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/coverage/
          retention-days: 30

  nlp-test:
    name: NLP Service Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nlp-service/package-lock.json
      
      - name: Install nlp-service dependencies
        run: |
          cd nlp-service
          npm install
      
      - name: Run nlp-service tests with coverage
        run: |
          cd nlp-service
          npm test -- --coverage
      
      - name: Upload nlp-service coverage report
        uses: actions/upload-artifact@v4
        with:
          name: nlp-coverage-report
          path: nlp-service/coverage/
          retention-days: 30
      
      - name: Upload nlp-service test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlp-test-results
          path: nlp-service/coverage/
          retention-days: 30

  e2e-test:
    name: E2E Tests with Playwright
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, nlp-test]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: shopcart_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Compose
        run: |
          docker compose version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d db backend nlp-service
          docker compose ps
      
      - name: Wait for backend to be healthy
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:8081/api/health; do sleep 5; done'
      
      - name: Set up Node.js for E2E tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e-tests/package-lock.json
      
      - name: Install E2E test dependencies
        run: |
          cd e2e-tests
          npm install
      
      - name: Install Playwright browsers
        run: |
          cd e2e-tests
          npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        run: |
          cd e2e-tests
          npm test
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 30
      
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: e2e-tests/test-results/
          retention-days: 30
      
      - name: Stop services
        if: always()
        run: |
          docker compose down

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, nlp-test, e2e-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/shopcart-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/shopcart-backend:latest
      
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/shopcart-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/shopcart-frontend:latest
