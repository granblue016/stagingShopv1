name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: shopcart_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run backend tests with coverage
        run: |
          cd backend
          mvn clean test
      
      - name: Generate JaCoCo coverage report
        run: |
          cd backend
          mvn jacoco:report
      
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 30
      
      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 30

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      
      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm run test:coverage -- --run
      
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30
      
      - name: Upload frontend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/coverage/
          retention-days: 30

  nlp-test:
    name: NLP Service Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nlp-service/package-lock.json
      
      - name: Install nlp-service dependencies
        run: |
          cd nlp-service
          npm install
      
      - name: Run nlp-service tests with coverage
        run: |
          cd nlp-service
          npm test -- --coverage
      
      - name: Upload nlp-service coverage report
        uses: actions/upload-artifact@v4
        with:
          name: nlp-coverage-report
          path: nlp-service/coverage/
          retention-days: 30
      
      - name: Upload nlp-service test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlp-test-results
          path: nlp-service/coverage/
          retention-days: 30

  e2e-test:
    name: E2E Tests with Playwright
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, nlp-test]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: shopcart_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            nlp-service/package-lock.json
            e2e-tests/package-lock.json
      
      - name: Install backend dependencies and build
        run: |
          cd backend
          mvn clean install -DskipTests
      
      - name: Start backend in background
        run: |
          cd backend
          nohup mvn spring-boot:run > ../backend.log 2>&1 &
          echo $! > ../backend.pid
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shopcart_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: admin
          SERVER_PORT: 8081
      
      - name: Install wait-on
        run: npm install -g wait-on
      
      - name: Wait for backend to be ready
        run: |
          timeout 120 wait-on http://localhost:8081/api/health || echo "Backend health check failed, continuing anyway"
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      
      - name: Start frontend in background
        run: |
          cd frontend
          nohup npm run dev > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid
      
      - name: Wait for frontend to be ready
        run: |
          timeout 120 wait-on http://localhost:8080 || echo "Frontend health check failed, continuing anyway"
      
      - name: Install nlp-service dependencies
        run: |
          cd nlp-service
          npm install
      
      - name: Start nlp-service in background
        run: |
          cd nlp-service
          nohup npm start > ../nlp-service.log 2>&1 &
          echo $! > ../nlp-service.pid
        env:
          NLP_PORT: 3001
      
      - name: Wait for nlp-service to be ready
        run: |
          timeout 120 wait-on http://localhost:3001/health || echo "NLP service health check failed, continuing anyway"
      
      - name: Install E2E test dependencies
        run: |
          cd e2e-tests
          npm install
      
      - name: Install Playwright browsers
        run: |
          cd e2e-tests
          npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        run: |
          cd e2e-tests
          npm test
        env:
          BASE_URL: http://localhost:8080
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 30
      
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: e2e-tests/test-results/
          retention-days: 30
      
      - name: Upload backend logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-logs
          path: backend.log
          retention-days: 7
      
      - name: Upload frontend logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-logs
          path: frontend.log
          retention-days: 7
      
      - name: Upload nlp-service logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlp-service-logs
          path: nlp-service.log
          retention-days: 7
      
      - name: Stop backend, frontend, and nlp-service
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi
          if [ -f frontend.pid ]; then
            kill $(cat frontend.pid) || true
            rm frontend.pid
          fi
          if [ -f nlp-service.pid ]; then
            kill $(cat nlp-service.pid) || true
            rm nlp-service.pid
          fi
